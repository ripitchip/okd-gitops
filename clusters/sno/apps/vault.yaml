# multi-source: chart from HashiCorp, values from this repo, plus the static PV/PVC
# (namespace vault must exist for the PVC; CreateNamespace=true handles that)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  project: platform
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault
      targetRevision: 0.29.0
      helm:
        valueFiles:
          - $values/platform/vault/values-common.yaml
    - repoURL: https://github.com/ripitchip/okd-gitops
      targetRevision: main
      ref: values
    - repoURL: https://github.com/ripitchip/okd-gitops
      targetRevision: main
      path: platform/vault/pvc
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  # the apiserver enriches each volumeClaimTemplate entry on read (apiVersion,
  # kind, status, volumeMode default) in ways the chart never sets — and the
  # field is immutable after creation anyway, so ignore it wholesale
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
