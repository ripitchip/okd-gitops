apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  url: https://argocd.tomlab.fr
  oidc.config: |
    name: Keycloak
    issuer: https://auth.tomlab.fr/realms/foobarbaz
    clientID: argocd
    requestedScopes:
      - openid
      - profile
      - email
      - groups
  # ExternalSecret fields the controller/webhook fill in after apply — without
  # this, Argo CD flags every ExternalSecret as permanently OutOfSync
  resource.customizations.ignoreDifferences.external-secrets.io_ExternalSecret: |
    jqPathExpressions:
      - .spec.data[]?.remoteRef.conversionStrategy
      - .spec.data[]?.remoteRef.decodingStrategy
      - .spec.data[]?.remoteRef.metadataPolicy
      - .spec.data[]?.remoteRef.nullBytePolicy
      - .spec.target.creationPolicy
      - .spec.target.deletionPolicy
      - .spec.target.template.engineVersion
      - .spec.target.template.mergePolicy
  # needed for sync waves between Applications to work
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
