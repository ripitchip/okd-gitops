# Le manifest upstream impose runAsUser: 999, hors de la plage d'UID du namespace.
# null supprime le champ : OpenShift attribue un UID valide (restricted-v2), sans SCC supplémentaire.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-redis
spec:
  template:
    spec:
      securityContext:
        runAsUser: null
