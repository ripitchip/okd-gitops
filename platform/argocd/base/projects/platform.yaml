# cluster-wide platform components; app teams get their own scoped projects later
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  description: Composants de plateforme (Argo CD, GPU, sécurité, observabilité)
  sourceRepos:
    - https://github.com/ripitchip/okd-gitops
    - https://helm.ngc.nvidia.com/nvidia
    - https://charts.external-secrets.io
    - https://helm.releases.hashicorp.com
    - https://aureq.github.io/cert-manager-webhook-ovh/
    - https://charts.jetstack.io
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
