# both sourced from the pre-existing Vault KV entries (secret/keycloak-admin,
# secret/ldap-secrets) kept from the previous cluster build
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-passwords
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: keycloak-passwords
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: keycloak-admin
        property: password
    # matches the original cluster's mapping (both keys -> "password"): the
    # existing postgres data was initialized with this value, not "db-password"
    - secretKey: db-password
      remoteRef:
        key: keycloak-admin
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ldap-passwords
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ldap-passwords
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: ldap-secrets
        property: admin_password
