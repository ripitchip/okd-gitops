# converted to a Route automatically (openshift.io/ingress-to-route), which also
# syncs the cert-manager-issued secret into the Route's TLS fields
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: openshift-default
  tls:
    - hosts:
        - auth.tomlab.fr
        - auth.foobarbaz.fr
      secretName: keycloak-tls-cert
  rules:
    - host: "auth.tomlab.fr"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
    - host: "auth.foobarbaz.fr"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
