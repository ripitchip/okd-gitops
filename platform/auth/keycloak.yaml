# no fixed UID/chown-as-root init containers (unlike the source cluster):
# restricted-v2 forbids runAsUser=0 entirely, so SCC assigns its own UID
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: auth
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: management
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  serviceName: keycloak
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: download-theme
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          command:
            - sh
            - -c
            - |
              wget -O /opt/keycloak/providers/keycloak-theme.jar https://github.com/ripitchip/keycloak-theme/releases/download/v1.0.2/keycloak-theme-for-kc-22-to-25.jar
          volumeMounts:
            - name: keycloak-providers-volume
              mountPath: /opt/keycloak/providers
              subPath: providers-data
        - name: prepare-lib
          image: quay.io/keycloak/keycloak:26.6.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          command: ["sh", "-c", "cp -rp /opt/keycloak/lib/quarkus/* /mnt/lib/"]
          volumeMounts:
            - name: keycloak-lib
              mountPath: /mnt/lib
        - name: wait-for-postgres
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          command:
            [
              "sh",
              "-c",
              "until nc -vz postgres.auth.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done;",
            ]
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.6.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          resources:
            limits:
              cpu: 1000m
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          args: ["start", "--http-enabled=true", "--metrics-enabled=true"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: "admin"
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-passwords
                  key: admin-password
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME
              value: "https://auth.tomlab.fr"
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL_HOST
              value: "postgres"
            - name: KC_DB_URL_DATABASE
              value: "keycloak"
            - name: KC_DB_USERNAME
              value: "keycloak"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-passwords
                  key: db-password
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          volumeMounts:
            - name: keycloak-providers-volume
              mountPath: /opt/keycloak/providers
              subPath: providers-data
            - name: keycloak-lib
              mountPath: /opt/keycloak/lib/quarkus
            - name: keycloak-data
              mountPath: /opt/keycloak/data
      volumes:
        - name: keycloak-providers-volume
          persistentVolumeClaim:
            claimName: keycloak-providers-data
        - name: keycloak-lib
          emptyDir: {}
        - name: keycloak-data
          emptyDir: {}
