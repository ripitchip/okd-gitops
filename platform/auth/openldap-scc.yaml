# anyuid forbids adding capabilities at all (allowedCapabilities: null), but
# openldap needs both a fixed UID (matching pre-existing NFS ownership) and
# NET_BIND_SERVICE (slapd's exec requirement) at once — hence this narrow,
# anyuid-derived SCC scoped only to the openldap ServiceAccount.
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: openldap-anyuid-netbind
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: true
allowPrivilegedContainer: false
allowedCapabilities:
  - NET_BIND_SERVICE
defaultAddCapabilities: null
fsGroup:
  type: RunAsAny
priority: 10
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - MKNOD
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  type: RunAsAny
users: []
volumes:
  - configMap
  - csi
  - downwardAPI
  - emptyDir
  - ephemeral
  - image
  - persistentVolumeClaim
  - projected
  - secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: use-openldap-scc
  namespace: auth
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["openldap-anyuid-netbind"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: use-openldap-scc
  namespace: auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: use-openldap-scc
subjects:
  - kind: ServiceAccount
    name: openldap
    namespace: auth
