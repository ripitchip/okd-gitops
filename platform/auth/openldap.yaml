# same anyuid + chown-as-root + subPath layout as postgres: the real data
# lives in the "ldap-data" subdirectory of the NFS export, owned by a fixed
# UID from the original cluster build (arbitrary-UID doesn't match it).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openldap
  namespace: auth
---
apiVersion: v1
kind: Service
metadata:
  name: openldap
  namespace: auth
spec:
  selector:
    app: openldap
  ports:
    - name: ldap
      port: 389
      targetPort: 8389
    - name: ldaps
      port: 636
      targetPort: 8636
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openldap
  template:
    metadata:
      labels:
        app: openldap
    spec:
      serviceAccountName: openldap
      securityContext:
        fsGroup: 3951
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 3951:3951 /bitnami/openldap"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: ldap-data
              mountPath: /bitnami/openldap
              subPath: ldap-data
      containers:
        - name: openldap
          image: jtgasper3/bitnami-openldap:2.6.13
          securityContext:
            runAsUser: 3951
            runAsGroup: 3951
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            # slapd (and slappasswd, same inode) carries a cap_net_bind_service
            # file capability; restricted-v2 drops it, so exec fails (EPERM)
            # without adding it back explicitly
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          env:
            - name: LDAP_ROOT
              value: "dc=home,dc=local"
            - name: LDAP_ADMIN_USERNAME
              value: "admin"
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ldap-passwords
                  key: admin-password
            - name: ORG_GROUPS_ENABLED
              value: "true"
            - name: LDAP_PORT_NUMBER
              value: "8389"
            - name: LDAP_LDAPS_PORT_NUMBER
              value: "8636"
            - name: LDAP_LISTEN_ADDRESSES
              value: "ldap://:8389/"
          volumeMounts:
            - name: ldap-data
              mountPath: /bitnami/openldap
              subPath: ldap-data
            - name: openldap-run
              mountPath: /opt/bitnami/openldap/var/run
      volumes:
        - name: ldap-data
          persistentVolumeClaim:
            claimName: openldap-data
        - name: openldap-run
          emptyDir: {}
