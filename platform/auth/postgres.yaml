# postgres's initdb hard-requires the data dir to be owned by the exact UID
# it runs as (not just writable) — arbitrary-UID doesn't work here, unlike
# vault/vaultwarden. Same anyuid + chown-as-root pattern as gpu-operator's
# kernel-repo (platform/gpu-operator/prereqs/base/scc-rbac.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: auth
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:anyuid
  namespace: auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: postgres
    namespace: auth
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: auth
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      serviceAccountName: postgres
      securityContext:
        fsGroup: 3215
        runAsNonRoot: true
        runAsUser: 3215
        runAsGroup: 3215
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              "chown -R 3215:3215 /var/lib/postgresql/data && chmod 700 /var/lib/postgresql/data",
            ]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: mirror.gcr.io/postgres:17
          securityContext:
            runAsUser: 3215
            runAsGroup: 3215
            runAsNonRoot: true
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          env:
            - name: POSTGRES_USER
              value: "keycloak"
            - name: POSTGRES_DB
              value: "keycloak"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-passwords
                  key: db-password
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: keycloak-db-data
