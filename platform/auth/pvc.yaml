# reuses the pre-existing NFS exports from the previous cluster build
apiVersion: v1
kind: PersistentVolume
metadata:
  name: openldap-pv-static
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: truenas-nfs
  mountOptions:
    - nfsvers=4.1
    - hard
    - nolock
  nfs:
    server: "10.0.40.10"
    path: "/mnt/data/k8s-cluster/pvc-volumes/openldap"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openldap-data
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  storageClassName: truenas-nfs
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  volumeName: openldap-pv-static
---
