# materializes secret/ovh/dns (vault kv put, done by hand) into a K8s Secret
# consumed by cert-manager-webhook-ovh's ClusterIssuer (ovhAuthenticationRef)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ovh-dns-credentials
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ovh-credentials
    creationPolicy: Owner
  data:
    - secretKey: applicationKey
      remoteRef:
        key: ovh/dns
        property: applicationKey
    - secretKey: applicationSecret
      remoteRef:
        key: ovh/dns
        property: applicationSecret
    - secretKey: applicationConsumerKey
      remoteRef:
        key: ovh/dns
        property: applicationConsumerKey
