# materializes secret/ovh-secrets (kept from the previous cluster build) into a
# K8s Secret consumed by cert-manager-webhook-ovh's ClusterIssuer (ovhAuthenticationRef)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ovh-dns-credentials
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ovh-credentials
    creationPolicy: Owner
  data:
    - secretKey: applicationKey
      remoteRef:
        key: ovh-secrets
        property: application-key
    - secretKey: applicationSecret
      remoteRef:
        key: ovh-secrets
        property: application-secret
    - secretKey: applicationConsumerKey
      remoteRef:
        key: ovh-secrets
        property: consumer-key
