operator:
  defaultRuntime: crio

nfd:
  enabled: true

driver:
  enabled: true
  # SCOS isn't recognized as OpenShift by the operator, so we set the image
  # (rocky10, by digest) and kernel RPM repo ourselves. See ADR 0002.
  repository: nvcr.io/nvidia
  image: driver
  repoConfig:
    configMapName: cs10-repos
  # single node: can't drain, so no auto upgrade
  upgradePolicy:
    autoUpgrade: false
