apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nvidia-gpu-operator

resources:
  - namespace.yaml
  - scc-rbac.yaml
  - kernel-repo.yaml

configMapGenerator:
  # name is fixed, referenced from Helm values (driver.repoConfig)
  - name: cs10-repos
    files:
      - cs10.repo
    options:
      disableNameSuffixHash: true
