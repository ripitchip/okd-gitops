apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nvidia-gpu-operator

resources:
  - namespace.yaml
  - scc-rbac.yaml
  - kernel-repo.yaml

configMapGenerator:
  # Dépôt dnf injecté dans le conteneur du driver (ClusterPolicy driver.repoConfig).
  # Nom fixe : il est référencé dans les values Helm.
  - name: cs10-repos
    files:
      - cs10.repo
    options:
      disableNameSuffixHash: true
