# Droits SCC, déclarés au lieu de `oc adm policy add-scc-to-user`.
# Noms identiques à ceux créés par oc adm policy : Argo CD reprend l'existant.
---
# NFD worker (sous-chart node-feature-discovery) : monte des hostPath pour inspecter le nœud.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:privileged
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: node-feature-discovery
    namespace: nvidia-gpu-operator
---
# kernel-repo : s'exécute en root pour installer createrepo_c.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:anyuid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: kernel-repo
    namespace: nvidia-gpu-operator
