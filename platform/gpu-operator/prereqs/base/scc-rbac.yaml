# names match `oc adm policy add-scc-to-user` so Argo CD adopts the existing bindings
---
# NFD worker needs hostPath access to inspect the node
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:privileged
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: node-feature-discovery
    namespace: nvidia-gpu-operator
---
# kernel-repo runs as root to install createrepo_c
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:anyuid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: kernel-repo
    namespace: nvidia-gpu-operator
