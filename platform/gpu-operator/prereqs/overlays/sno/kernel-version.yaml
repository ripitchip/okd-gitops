# uname -r, no .x86_64 suffix. Update before any kernel-changing OKD upgrade.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kernel-repo
spec:
  template:
    spec:
      initContainers:
        - name: fetch
          env:
            - name: KERNEL_VERSION
              value: "6.12.0-260.el10"
