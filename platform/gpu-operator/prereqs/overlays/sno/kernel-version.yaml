# Kernel du nœud sno (uname -r, sans le suffixe .x86_64).
# ⚠️ À mettre à jour AVANT chaque upgrade OKD qui change le kernel.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kernel-repo
spec:
  template:
    spec:
      initContainers:
        - name: fetch
          env:
            - name: KERNEL_VERSION
              value: "6.12.0-260.el10"
