# Settings applied to the database by init.sh on the first start, then fixed
# (ADR 0007): these files remain the record of what was applied.
apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-defaults
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  storage-template.yaml: |
    storageTemplate:
      enabled: true
      hashVerificationEnabled: true
      template: "{{y}}/{{y}}-{{MM}}-{{dd}}/{{filename}}"
  quota.yaml: |
    user:
      # GiB for every new user, -1 = none. The quota claim (immich_quota) is
      # ignored by this version: this value is what applies at registration.
      defaultStorageQuota: -1
