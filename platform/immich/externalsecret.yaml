# Same ExternalSecrets as the manifest of the maintainer (ADR 0007). Three secrets,
# created by hand in Vault (ADR 0004: the Vault role "external-secrets" is shared,
# nothing is created in Vault by GitOps):
#
#   vault kv put secret/immich-secrets \
#     db-password="$(openssl rand -hex 32)"
#
#   vault kv put secret/immich-oidc \
#     client-secret="<secret of the client immich of Keycloak>"
#
#   vault kv put secret/immich-backup \
#     api-key="<Administration > API Keys, created after the first start>"
#
# A missing key fails the sync of its ExternalSecret, not of the app (no sync-wave
# -10 SecretStore/ServiceAccount: the ClusterSecretStore of the platform is used).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-secrets-sync
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: immich-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: immich-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-oidc-sync
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: immich-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: immich-oidc
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-backup-sync
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: immich-backup
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: immich-backup
