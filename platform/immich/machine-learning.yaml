# Machine learning of Immich (smart search, faces, OCR, ADR 0007): CPU image (the
# NVIDIA one needs the GPU mapped into the container, no device plugin here). The
# cache of the models is volatile: the next job reloads them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: immich-machine-learning
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "7"
---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  selector:
    app: immich-machine-learning
  ports:
    - name: http
      port: 3003
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-machine-learning
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      serviceAccountName: immich-machine-learning
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ml
          image: ghcr.io/immich-app/immich-machine-learning:v3.4.2
          envFrom:
            - configMapRef:
                name: immich-config
          env:
            - name: IMMICH_PORT
              value: "3003"
            - name: MACHINE_LEARNING_CACHE_FOLDER
              value: "/cache"
            - name: MACHINE_LEARNING_MODEL_REVISION
              value: "v2"
            - name: HOME
              value: "/tmp"
            - name: MPLCONFIGDIR
              value: "/tmp/matplotlib"
            - name: XDG_CONFIG_HOME
              value: "/tmp/.config"
            - name: XDG_CACHE_HOME
              value: "/tmp/.cache"
            - name: HF_HOME
              value: "/cache/huggingface"
          ports:
            - name: http
              containerPort: 3003
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
