# immich-migrate Job (ADR 0007), sync-wave 9: schema-check needs postgres AND
# redis actually reachable (confirmed live: ECONNREFUSED until they are), not
# just created, so it runs after wave 8 (postgres/redis/machine-learning), and
# immich-server (wave 10) waits on it in turn, since Argo CD gates each wave
# on the previous one's health -- it does NOT run everything in parallel and
# let retries "absorb" the ordering, whatever an earlier note here assumed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: immich-migrate
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "7"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: immich-migrate
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "9"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app: immich-migrate
    spec:
      serviceAccountName: immich-migrate
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/immich-app/immich-server:v3.4.2
          command: ["/bin/bash", "/opt/immich-scripts/migrate.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
          envFrom:
            - configMapRef:
                name: immich-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: db-password
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: scripts
              mountPath: /opt/immich-scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        # migrate.sh sources libcommon.sh: both land in the same directory
        - name: scripts
          projected:
            defaultMode: 0755
            sources:
              - configMap:
                  name: immich-scripts-lib
              - configMap:
                  name: immich-scripts-migrate
        - name: tmp
          emptyDir: {}
