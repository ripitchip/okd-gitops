# Postgres of Immich (ADR 0007). Data on immich-db-local, disk local au nœud :
# l'entrypoint de l'image refuse un FS réseau, l'export NFS de l'ancien cluster
# immich-db-pvc ne peut donc pas être PGDATA.
#  * récupération de l'ancienne base : le Job immich-db-restore (ADR 0007), qui
#    monte immich-db-pvc en lecture et fait pg_dump/pg_restore ;
#  * migrations du schéma : le Job immich-migrate (pas de node dans cette image) ;
#  * UID 1000, chown par 1001 : la SCC n'ajoute pas CHOWN, le propriétaire du
#    volume le permet (create/delete) ;
#  * PGDATA=data/pgdata : l'init crée le dossier, un répertoire parasite de
#    l'export ne le perturbe pas ;
#  * IGNORE_DATABASE_FSTYPE=true : l'entrypoint ne connaît que ext2/3/4, xfs,
#    btrfs, zfs, f2fs, tmpfs, un disque formaté autrement reste local.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: immich-postgres
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "7"
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: immich
spec:
  selector:
    app: immich-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      serviceAccountName: immich-postgres
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # initdb requires the data directory to be owned by the UID of postgres
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /data/pgdata && chown -R 1000:1000 /data/pgdata && chmod 700 /data/pgdata"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              add: ["CHOWN", "FOWNER"]
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /data
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
          env:
            - name: POSTGRES_USER
              value: "immich"
            - name: POSTGRES_DB
              value: "immich"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: db-password
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
            - name: DB_STORAGE_TYPE
              value: "HDD"
            - name: IGNORE_DATABASE_FSTYPE
              value: "true"
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command: ["/usr/bin/pg_isready", "-h", "localhost", "-U", "immich", "-d", "immich"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["/usr/bin/pg_isready", "-h", "localhost", "-U", "immich", "-d", "immich"]
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            # initdb writes in /dev/shm: an emptyDir from the pod, not the SCC
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-run
              mountPath: /var/run/postgresql
            - name: dev-shm
              mountPath: /dev/shm
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: immich-db-local
        - name: postgres-run
          emptyDir: {}
        - name: dev-shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
