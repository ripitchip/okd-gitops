# Narrow, anyuid-derived SCC, same pattern as openldap-anyuid-netbind
# (platform/auth): anyuid forbids adding capabilities (allowedCapabilities: null),
# and the "fix-permissions" init containers need CHOWN/FOWNER. Bound to every
# ServiceAccount of the namespace whose pods pin runAsUser: 1000 (outside the
# namespace's allocated range, so restricted-v2 alone would reject them).
#
# ClusterRole, not a namespaced Role: a Role granting "use" on this SCC let
# Deployment-created pods (openldap-anyuid-netbind, platform/auth, works the
# same way) through, but the immich-migrate Job's pods were rejected outright
# — immich-anyuid-chown never even appeared as a candidate in the SCC
# admission error, for reasons that didn't reduce to RBAC (`oc auth can-i`
# said yes the whole time). `oc adm policy add-scc-to-user` — which creates
# a ClusterRole named `system:openshift:scc:<scc>`, the same shape
# platform/auth/scc-rbac.yaml uses for the built-in `anyuid` SCC — fixed it
# immediately. Matching that proven path here rather than chasing the root
# cause further.
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: immich-anyuid-chown
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: true
allowPrivilegedContainer: false
allowedCapabilities:
  - CHOWN
  - FOWNER
defaultAddCapabilities: null
fsGroup:
  type: RunAsAny
priority: 10
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - MKNOD
runAsUser:
  type: RunAsAny
seccompProfiles:
  - runtime/default
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  type: RunAsAny
users: []
volumes:
  - configMap
  - csi
  - downwardAPI
  - emptyDir
  - ephemeral
  - image
  - persistentVolumeClaim
  - projected
  - secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: use-immich-scc
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["immich-anyuid-chown"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: use-immich-scc
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: use-immich-scc
subjects:
  - kind: ServiceAccount
    name: immich-server
    namespace: immich
  - kind: ServiceAccount
    name: immich-microservices
    namespace: immich
  - kind: ServiceAccount
    name: immich-postgres
    namespace: immich
  - kind: ServiceAccount
    name: immich-migrate
    namespace: immich
  - kind: ServiceAccount
    name: immich-redis
    namespace: immich
  - kind: ServiceAccount
    name: immich-machine-learning
    namespace: immich
