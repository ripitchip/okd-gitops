# api-key.sh, postStart hook of immich-server's own "server" container (ADR 0007):
# NOT an init container -- it was, but its curl loop against localhost always found
# nothing listening (confirmed live: the main container doesn't exist yet during
# init, ~10 minutes burned every start for nothing, exit 0, no admin account ever
# created). postStart runs inside the container once it exists; the ping-retry loop
# below absorbs the remaining race against the app actually listening.
#
#  1. an API key: Immich stores keys hashed (sha256), the API never returns a
#     secret, so the key of the CronJob cannot be written from Vault: created here
#     through the API, rotated when the pod restarts, copied to Vault by hand. The
#     other keys are revoked (a rotated key keeps admin rights forever);
#  2. the local admin account: the first signup of a pristine Immich is the admin,
#     created here with the admin email/password of the immich-secrets Secret.
#     ONLY on a pristine database: resetting an Immich account has no CLI here, a
#     database restored from the previous cluster keeps its own accounts;
#  3. OAuth + storage template, through GET/PUT /api/system-config, once (gated on
#     oauth.issuerUrl being empty) -- NOT the raw-SQL approach this used to be
#     (init.sh, apply-config.sql against system_metadata key 'systemConfig', flat
#     dotted fields). Confirmed against a real v3.4.2 instance: the actual key is
#     'system-config' and the value is a nested object ({oauth: {...}, ...}); months
#     of "applied" config sat under a key the server never reads. The real API is
#     also what survives the next version's internal schema changing again.
#
# The key lands in /run/immich-state/key.txt, the "state" emptyDir of the pod
# (survives a container restart, not a pod recreation; NOT /run/secrets -- confirmed
# live, CRI-O auto-injects root:root content there that blocks writes under it):
# copy it to secret/immich-backup, the next runs reuse it (ADR 0007).
apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-scripts-apikey
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  api-key.sh: |
    . /opt/immich-scripts/libcommon.sh

    api="http://localhost:${IMMICH_PORT:-2283}/api"
    url=$(db_url)
    email=$(cat /run/init/admin-email)
    password=$(cat /run/init/admin-password)

    for i in $(seq 1 120); do
      curl -fsS -m 5 "$api/server/ping" >/dev/null 2>&1 && break
      sleep 5
    done

    if [ "$(psql "$url" -Atc 'SELECT count(*) FROM "user" WHERE "deletedAt" IS NULL')" = "0" ]; then
      curl -fsS -c /tmp/cookies -X POST "$api/auth/admin-sign-up" \
        -H 'Content-Type: application/json' \
        -d "{\"name\":\"Admin\",\"email\":\"$email\",\"password\":\"$password\"}" >/dev/null
      echo "first account created: $email"
    fi

    key=""
    if [ -s /run/immich-state/key.txt ]; then
      key=$(cat /run/immich-state/key.txt)
    fi
    if [ -n "$key" ] && curl -fsS -o /dev/null -m 10 -H "x-api-key: $key" "$api/api-keys/me"; then
      header="x-api-key: $key"
    else
      curl -fsS -c /tmp/cookies -X POST "$api/auth/login" \
        -H 'Content-Type: application/json' \
        -d "{\"email\":\"$email\",\"password\":\"$password\"}" >/dev/null
      header="x-immich-user-token: $(awk '$6 == "immich_access_token" { print $7 }' /tmp/cookies | tail -1)"
    fi

    current=$(curl -fsS -H "$header" "$api/system-config" 2>/dev/null || true)
    if [ -n "$current" ] && [ -z "$(printf '%s' "$current" | json_get 'data.oauth.issuerUrl')" ]; then
      updated=$(printf '%s' "$current" | node -e '
        let d = "";
        process.stdin.on("data", (c) => { d += c; });
        process.stdin.on("end", () => {
          const config = JSON.parse(d);
          Object.assign(config.oauth, {
            enabled: true,
            autoLaunch: true,
            autoRegister: true,
            buttonText: "Se connecter avec Keycloak",
            clientId: process.env.OIDC_CLIENT_ID,
            clientSecret: process.env.OIDC_CLIENT_SECRET,
            issuerUrl: process.env.OIDC_ISSUER,
            accountManagementUrl: process.env.OIDC_ACCOUNT_URL,
            scope: "openid email profile",
            signingAlgorithm: "RS256",
            profileSigningAlgorithm: "none",
            storageLabelClaim: "preferred_username",
            roleClaim: "immich_role",
            tokenEndpointAuthMethod: "client_secret_post",
            timeout: 30000,
            prompt: "",
          });
          Object.assign(config.storageTemplate, {
            enabled: true,
            hashVerificationEnabled: true,
            template: "{{y}}/{{y}}-{{MM}}-{{dd}}/{{filename}}",
          });
          process.stdout.write(JSON.stringify(config));
        });
      ')
      curl -fsS -X PUT -H "$header" -H 'Content-Type: application/json' -d "$updated" "$api/system-config" >/dev/null
      echo "system-config: oauth + storage template applied"
    fi

    keys=$(curl -fsS -H "$header" "$api/api-keys" 2>/dev/null || true)
    if [ -z "$keys" ]; then
      echo "no session to manage the API key: the admin account of immich-secrets does not" >&2
      echo "exist on this instance (restored data). Create the key in Immich" >&2
      echo "(Account > API Keys) and put it in secret/immich-backup, then restart the pod" >&2
    else
      id=$(printf '%s' "$keys" | json_get 'data.find((k) => k.name === "immich-backup")?.id')
      if [ -n "$id" ]; then
        printf '%s' "$keys" | node -e '
          let d = "";
          process.stdin.on("data", (c) => { d += c; });
          process.stdin.on("end", () => {
            for (const k of JSON.parse(d)) if (k.id !== process.argv[1]) console.log(k.id);
          });
        ' "$id" \
          | while read -r stale; do
              curl -fsS -o /dev/null -X DELETE -H "$header" "$api/api-keys/$stale"
              echo "revoked API key $stale"
            done
        secret=$(curl -fsS -X POST -H "$header" "$api/api-keys/$id/rotate" | json_get 'data.secret')
        echo "immich-backup: key rotated"
      else
        secret=$(curl -fsS -X POST -H "$header" -H 'Content-Type: application/json' \
          -d '{"name":"immich-backup","permissions":["all"]}' "$api/api-keys" | json_get 'data.secret')
        echo "immich-backup: key created"
      fi
      umask 077
      printf '%s' "$secret" > /run/immich-state/key.txt
      echo "key.txt written: copy it to secret/immich-backup (ADR 0007)"
    fi

    # no zonal failure of the pod for a key: the CronJob reports it on its own
    exit 0
