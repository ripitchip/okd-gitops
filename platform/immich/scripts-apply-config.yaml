# apply-config.sql: called by init.sh on a fresh instance (ADR 0007), before the
# API: nothing here needs it.
#
#  1. OAuth settings: Immich cannot be bootstrapped without a login (OIDC only,
#     auto-launch). Once done, they are managed from the web UI.
#  2. storage template and quota, once: Immich refuses a template change as soon
#     as assets exist, and the quota claim (immich_quota) is ignored by this
#     version: without the server value, every OIDC account would be at 0 GiB and
#     blocked for uploads.
# The API key of the immich-backup Secret is api-key.sh (the API is needed).
#
# psql -v fills :'name' from the environment of init.sh and the config files, no
# value is quoted by a shell. Every statement re-reads systemConfig: two UPDATEs of
# one snapshot would drop each other's keys.
apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-scripts-config
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  apply-config.sql: |
    SELECT pg_catalog.set_config('search_path', 'public', false);

    BEGIN;

    -- flatten a config document: {"a": {"b": 1}} -> {"a.b": 1}
    CREATE FUNCTION pg_temp.flatten_config(doc jsonb) RETURNS jsonb
    LANGUAGE sql IMMUTABLE AS $$
      SELECT COALESCE(jsonb_object_agg(key, value), '{}'::jsonb) FROM jsonb_each(doc)
    $$;

    -- 1. OAuth ----------------------------------------------------------------
    CREATE TEMP TABLE oauth_config ON COMMIT DROP AS
      SELECT jsonb_build_object(
        'oauth.enabled', true,
        'oauth.autoLaunch', true,
        'oauth.autoRegister', true,
        'oauth.buttonText', 'Se connecter avec Keycloak',
        'oauth.clientId', :'oidc_client_id',
        'oauth.clientSecret', :'oidc_client_secret',
        'oauth.issuerUrl', :'oidc_issuer',
        'oauth.scope', 'openid email profile',
        'oauth.signingAlgorithm', 'RS256',
        'oauth.profileSigningAlgorithm', 'none',
        'oauth.storageLabelClaim', 'preferred_username',
        'oauth.roleClaim', 'immich_role',
        'oauth.accountManagementUrl', :'oidc_account_url',
        'oauth.tokenEndpointAuthMethod', 'client_secret_post',
        'oauth.timeout', 30000,
        'oauth.prompt', ''
      ) AS config;

    INSERT INTO system_metadata (key, value)
    SELECT 'systemConfig', to_jsonb(config) FROM oauth_config
    WHERE NOT EXISTS (SELECT 1 FROM system_metadata WHERE key = 'oauthSetup');

    UPDATE system_metadata SET value = to_jsonb(value) || (SELECT to_jsonb(config) FROM oauth_config)
    WHERE key = 'systemConfig' AND NOT EXISTS (SELECT 1 FROM system_metadata WHERE key = 'oauthSetup');

    -- 2. storage template -----------------------------------------------------
    CREATE TEMP TABLE storage_template_config ON COMMIT DROP AS
      SELECT pg_temp.flatten_config(:'storage_template'::jsonb) AS config;

    INSERT INTO system_metadata (key, value)
    SELECT 'systemConfig', to_jsonb(config) FROM storage_template_config
    WHERE NOT EXISTS (SELECT 1 FROM system_metadata WHERE key = 'storageTemplateMigration');

    UPDATE system_metadata SET value = to_jsonb(value) || (SELECT to_jsonb(config) FROM storage_template_config)
    WHERE key = 'systemConfig' AND NOT EXISTS (SELECT 1 FROM system_metadata WHERE key = 'storageTemplateMigration');

    -- 3. quota of the new users (GiB, -1 = none): the claim is ignored by this
    --    version, the value of the server config is what applies on registration
    CREATE TEMP TABLE quota_config ON COMMIT DROP AS
      SELECT pg_temp.flatten_config(:'quota'::jsonb) AS config;

    UPDATE system_metadata SET value = to_jsonb(value) || (SELECT to_jsonb(config) FROM quota_config)
    WHERE key = 'systemConfig' AND NOT EXISTS (SELECT 1 FROM system_metadata WHERE key = 'storageQuotas');

    INSERT INTO system_metadata (key, value)
    SELECT 'storageQuotas', jsonb_build_object('default', ((SELECT config FROM quota_config)->>'user.defaultStorageQuota')::int)
    ON CONFLICT (key) DO NOTHING;

    -- 4. quotas of the accounts that exist already, then the markers -----------
    CREATE TEMP TABLE quota_users ON COMMIT DROP AS
      SELECT email, gib::int AS gib
      FROM jsonb_each(COALESCE((SELECT config FROM quota_config) - 'user', '{}'::jsonb));

    UPDATE "user" u
    SET "quotaSizeInBytes" = CASE WHEN q.gib < 0 THEN NULL ELSE q.gib::bigint * 1073741824 END
    FROM quota_users q
    WHERE u.email = q.email AND u."deletedAt" IS NULL
      AND NOT EXISTS (SELECT 1 FROM system_metadata WHERE key = 'storageQuotas');

    UPDATE system_metadata SET value = to_jsonb(value) || jsonb_build_object(
      'users', COALESCE((SELECT jsonb_object_agg(email, gib) FROM quota_users), '{}'::jsonb))
    WHERE key = 'storageQuotas';

    INSERT INTO system_metadata (key, value) VALUES ('oauthSetup', '{}'::jsonb)
    ON CONFLICT (key) DO NOTHING;

    INSERT INTO system_metadata (key, value)
    VALUES ('storageTemplateMigration', '{"enabled": true, "completed": true}'::jsonb)
    ON CONFLICT (key) DO NOTHING;

    COMMIT;
