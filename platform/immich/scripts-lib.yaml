# libcommon.sh, sourced by init.sh, api-key.sh and migrate.sh (ADR 0007). The
# immich images ship bash, node, curl and every pg_dump/psql major version --
# NOT jq (confirmed live: "jq: command not found"), hence json_get() below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-scripts-lib
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  libcommon.sh: |
    # sourced by init.sh, api-key.sh and migrate.sh
    set -eu

    # Percent-encodes the user/password components of the connection URI below:
    # confirmed live, the original cluster's db-password has characters (':',
    # '@', ...) that otherwise shift the URI parse, ending up as part of the
    # "port" (psql: "invalid integer value ... for connection option port").
    urlencode() {
      local string="$1" encoded="" c i
      for (( i=0; i<${#string}; i++ )); do
        c="${string:i:1}"
        case "$c" in
          [a-zA-Z0-9.~_-]) encoded+="$c" ;;
          *) encoded+=$(printf '%%%02X' "'$c") ;;
        esac
      done
      printf '%s' "$encoded"
    }

    # The password comes from the env of the pod (a secretKeyRef). On OpenShift a
    # Secret is world-readable so that any UID of the range can use it: the same
    # key also signs the API requests of the CronJob (ADR 0007), the media volume
    # stays 0700 for UID 1000.
    db_url() {
      if [ -z "${DB_PASSWORD:-}" ]; then
        echo "DB_PASSWORD is empty: set db-password in secret/immich-secrets (ADR 0007)" >&2
        exit 1
      fi
      printf 'postgresql://%s:%s@%s:%s/%s' \
        "$(urlencode "$DB_USERNAME")" "$(urlencode "$DB_PASSWORD")" "$DB_HOSTNAME" "${DB_PORT:-5432}" "$DB_DATABASE_NAME"
    }

    # No jq in this image: node is there instead (it's how the app itself runs).
    # Reads JSON from stdin, evaluates `expr` with it bound to `data`, writes the
    # result ("" for undefined/null, so `-n "$(...)"` checks behave the same way
    # a missing jq field would).
    json_get() {
      node -e '
        let d = "";
        process.stdin.on("data", (c) => { d += c; });
        process.stdin.on("end", () => {
          const data = JSON.parse(d);
          const result = eval(process.argv[1]);
          process.stdout.write(result === undefined || result === null ? "" : String(result));
        });
      ' "$1"
    }

    # The immich images already ship every pg_dump/psql major version
    # (/usr/lib/postgresql/*/bin): pick the one of the running server.
    pg_bin() {
      bin=$1
      version=$(psql "$(db_url)" -Atc 'SHOW server_version')
      major=${version%%.*}
      if [ ! -x "/usr/lib/postgresql/$major/bin/$bin" ]; then
        echo "no $bin for PostgreSQL $version in this image" >&2
        return 1
      fi
      echo "/usr/lib/postgresql/$major/bin/$bin"
    }
