# migrate.sh, immich-migrate Job before immich-server (ADR 0007): the schema
# migrations, then the scratch databases the migration tools create on every run.
# It replaced the automatic migration of the server, which would drop the
# search_path setting of the database.
#
#  * the binary is `immich-admin` (ghcr.io/immich-app/immich-server:v3.4.2's
#    /usr/src/app/server/bin/immich-admin), not `immich_admin_cli`; it has no
#    `--no-exit-code` flag either (confirmed against the live image: "error:
#    unknown option"). Its exit code can still be non-zero on a warning, so
#    the `|| true` plus parsing the output (a real failure does not say "up
#    to date") stays, just without the flag;
#  * the Admin CLI creates its own database on every run, sql-tools checks the
#    built-in "postgres" one: both are removed once the migration is done;
#  * schema-check verifies an ALREADY-migrated database against what the server
#    expects; it has no "apply" mode (confirmed: immich-admin's command list has
#    no migrate/apply, only schema-check) and fails outright on a pristine one
#    ("relation \"kysely_migrations\" does not exist" -- confirmed live, first
#    install). Same guard as init.sh's system_metadata check: skip cleanly when
#    there is nothing to check yet, the server's own bootstrap creates it
#    (DB_SKIP_MIGRATIONS stays false on immich-server, ADR 0007).
apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-scripts-migrate
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  migrate.sh: |
    . /opt/immich-scripts/libcommon.sh

    url=$(db_url)
    if [ "$(psql "$url" -Atc "SELECT to_regclass('kysely_migrations') IS NULL")" = "t" ]; then
      echo "pristine database, no migrations table yet: nothing to check, the server bootstraps it"
      exit 0
    fi

    log=$(mktemp)
    trap 'rm -f "$log"' EXIT

    immich-admin schema-check </dev/null >"$log" 2>&1 || true
    cat "$log"
    if ! grep -q 'Migrations are up to date' "$log"; then
      echo "schema-check failed" >&2
      exit 1
    fi

    for db in postgres "$DB_DATABASE_NAME"; do
      psql "${url%/*}/postgres" -v ON_ERROR_STOP=1 -v db="$db" \
        -c 'DROP DATABASE IF EXISTS :"db"' >/dev/null 2>&1 \
        || echo "database $db not dropped (open session), ignored"
    done
