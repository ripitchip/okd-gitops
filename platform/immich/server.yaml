# immich-server Deployment + Service (ADR 0007), sync-wave 10: after the migration
# Job. Starts the API only (server + API); the Jobs are the microservices.
# OIDC settings live in the database (system-config, applied once by api-key.sh's
# postStart hook through the real API -- see scripts-apikey.yaml); the env vars
# below just hand it the values to apply, immich-server itself never reads them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: immich-server
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "7"
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
spec:
  selector:
    app: immich-server
  ports:
    - name: http
      port: 2283
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      serviceAccountName: immich-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Ownership of a new NFS export (ADR 0007: no fsGroup on the volume itself)
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              add: ["CHOWN", "FOWNER"]
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: library
              mountPath: /data
        # Media folders of a fresh instance (init.sh): no DB access any more, see
        # scripts-init.yaml.
        - name: init
          image: ghcr.io/immich-app/immich-server:v3.4.2
          command: ["/bin/bash", "/opt/immich-scripts/init.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
          env:
            - name: IMMICH_MEDIA_LOCATION
              value: "/data"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: library
              mountPath: /data
            - name: scripts
              mountPath: /opt/immich-scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: server
          image: ghcr.io/immich-app/immich-server:v3.4.2
          envFrom:
            - configMapRef:
                name: immich-config
          env:
            - name: IMMICH_WORKERS_INCLUDE
              value: "api"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: db-password
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: immich-oidc
                  key: client-secret
            - name: OIDC_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: immich-oidc
                  key: client-id
            - name: OIDC_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: immich-oidc
                  key: issuer
            - name: OIDC_ACCOUNT_URL
              valueFrom:
                configMapKeyRef:
                  name: immich-oidc
                  key: account-url
          ports:
            - name: http
              containerPort: 2283
          # First account (the admin, OIDC is for the others), then the API key of
          # the Secret (created, rotated, the others revoked): api-key.sh. A postStart
          # hook, not an init container: as an init container it ran before this very
          # container existed, so its own curl loop against localhost:2283 could never
          # reach anything (confirmed live: it just burned ~10 minutes, then gave up
          # silently, exit 0, no admin account ever created). postStart runs inside
          # this container once it exists; api-key.sh's own ping-retry loop absorbs
          # the remaining race against the app actually listening.
          lifecycle:
            postStart:
              exec:
                command: ["/bin/bash", "/opt/immich-scripts/api-key.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: library
              mountPath: /data
            - name: scripts-api-key
              mountPath: /opt/immich-scripts
              readOnly: true
            # the admin credentials of the Secret, in their own directory
            - name: init-secret
              mountPath: /run/init
              readOnly: true
            # postStart's api-key.sh writes the rotated key here. Not /run/secrets:
            # CRI-O auto-injects root:root content there (kubernetes.io/, rhsm/) that
            # collides with a plain volume mount -- confirmed live, "Permission
            # denied" writing key.txt under it, even though the emptyDir itself is
            # 0777 (reproduced in isolation: identical write succeeds at any other
            # path).
            - name: state
              mountPath: /run/immich-state
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: immich-library-pvc
        # init.sh and api-key.sh both source libcommon.sh: combined into the same directory
        - name: scripts
          projected:
            defaultMode: 0755
            sources:
              - configMap:
                  name: immich-scripts-lib
              - configMap:
                  name: immich-scripts-init
        - name: scripts-api-key
          projected:
            defaultMode: 0755
            sources:
              - configMap:
                  name: immich-scripts-lib
              - configMap:
                  name: immich-scripts-apikey
        - name: init-secret
          secret:
            secretName: immich-secrets
            items:
              - key: admin-email
                path: admin-email
              - key: admin-password
                path: admin-password
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
