# Same ExternalSecret shape as immich (ADR 0004: the shared ClusterSecretStore
# vault-backend, Vault role "external-secrets", a navidrome-policy granting it
# read access to secret/navidrome-secrets created and attached by hand in Vault):
#
#   vault policy write navidrome-policy - <<'EOF'
#   path "secret/data/navidrome-secrets" { capabilities = ["read"] }
#   path "secret/metadata/navidrome-secrets" { capabilities = ["read"] }
#   EOF
#   vault write auth/kubernetes/role/external-secrets \
#     policies=<existing policies>,navidrome-policy ...
#
#   vault kv put secret/navidrome-secrets \
#     subsonic_user="<a navidrome account, created by hand after first login>" \
#     subsonic_pass="<its password>"
#
# subsonic-user/pass are Navidrome's OWN Subsonic API credentials for the
# lyrics-fetcher sidecar to call back into the same instance (ADR 0008) -- not an
# external service. There is no admin-bootstrap mechanism here (unlike Immich):
# the first account created through the web UI becomes the admin.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: navidrome-lyrics-fetcher-creds-sync
  namespace: navidrome
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: navidrome-lyrics-fetcher-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: navidrome-secrets
