# Content-Security-Policy of the proxy: the v9.1.0 defaults (services/proxy/pkg/config/csp.yaml)
# plus what Keycloak and the web extensions need. Re-check on OpenCloud upgrades.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencloud-csp
  namespace: opencloud
data:
  csp.yaml: |
    directives:
      child-src:
        - '''self'''
      connect-src:
        - '''self'''
        - 'blob:'
        - 'https://raw.githubusercontent.com/opencloud-eu/awesome-apps/'
        - 'https://update.opencloud.eu/'
        # OIDC discovery, token and userinfo endpoints of Keycloak
        - 'https://auth.tomlab.fr/'
        # map tiles of the preview app
        - 'https://tile.openstreetmap.org/'
      default-src:
        - '''none'''
      font-src:
        - '''self'''
        # icon font (FullCalendar) shipped as a data: URI by the calendar app
        - 'data:'
      frame-ancestors:
        - '''self'''
      frame-src:
        - '''self'''
        - 'blob:'
        # draw-io extension
        - 'https://embed.diagrams.net/'
        - 'https://docs.opencloud.eu'
        # Keycloak login frame (silent redirect)
        - 'https://auth.tomlab.fr/'
      img-src:
        - '''self'''
        - 'data:'
        - 'blob:'
        - 'https://raw.githubusercontent.com/opencloud-eu/awesome-apps/'
        - 'https://tile.openstreetmap.org/'
      manifest-src:
        - '''self'''
      media-src:
        - '''self'''
        - 'blob:'
      object-src:
        - '''self'''
        - 'blob:'
      script-src:
        - '''self'''
        - '''unsafe-inline'''
        - 'https://auth.tomlab.fr/'
      style-src:
        - '''self'''
        - '''unsafe-inline'''
        - 'blob:'
      worker-src:
        - '''self'''
        - 'blob:'
