# Every random value `opencloud init` would generate, made stable and shared: same values
# on every replica, kept across restarts. Path secret/opencloud-secrets in Vault:
#
#   vault kv put secret/opencloud-secrets \
#     jwt-secret="$(openssl rand -hex 32)" \
#     machine-auth-api-key="$(openssl rand -hex 32)" \
#     transfer-secret="$(openssl rand -hex 32)" \
#     url-signing-secret="$(openssl rand -hex 32)" \
#     system-user-api-key="$(openssl rand -hex 32)" \
#     service-account-secret="$(openssl rand -hex 32)" \
#     idm-admin-password="$(openssl rand -hex 32)" \
#     idm-idm-password="$(openssl rand -hex 32)" \
#     idm-reva-password="$(openssl rand -hex 32)" \
#     idm-idp-password="$(openssl rand -hex 32)" \
#     calshare-proxy-secret="$(openssl rand -hex 32)"
#
# idm-*-password are hashed into the IDM database on its first start only (the admin
# account is created then); changing them afterwards has no effect. Same for
# system-user-id / admin-user-id, hardcoded (not secret) in opencloud-config.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencloud-secrets
  namespace: opencloud
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: opencloud-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        JWT_SECRET: "{{ .jwt_secret }}"
        MACHINE_AUTH_API_KEY: "{{ .machine_auth_api_key }}"
        TRANSFER_SECRET: "{{ .transfer_secret }}"
        URL_SIGNING_SECRET: "{{ .url_signing_secret }}"
        SYSTEM_USER_API_KEY: "{{ .system_user_api_key }}"
        SERVICE_ACCOUNT_SECRET: "{{ .service_account_secret }}"
        IDM_ADMIN_PASSWORD: "{{ .idm_admin_password }}"
        IDM_IDM_PASSWORD: "{{ .idm_idm_password }}"
        IDM_REVA_PASSWORD: "{{ .idm_reva_password }}"
        IDM_IDP_PASSWORD: "{{ .idm_idp_password }}"
        CALSHARE_PROXY_SECRET: "{{ .calshare_proxy_secret }}"
  data:
    - secretKey: jwt_secret
      remoteRef:
        key: opencloud-secrets
        property: jwt-secret
    - secretKey: machine_auth_api_key
      remoteRef:
        key: opencloud-secrets
        property: machine-auth-api-key
    - secretKey: transfer_secret
      remoteRef:
        key: opencloud-secrets
        property: transfer-secret
    - secretKey: url_signing_secret
      remoteRef:
        key: opencloud-secrets
        property: url-signing-secret
    - secretKey: system_user_api_key
      remoteRef:
        key: opencloud-secrets
        property: system-user-api-key
    - secretKey: service_account_secret
      remoteRef:
        key: opencloud-secrets
        property: service-account-secret
    - secretKey: idm_admin_password
      remoteRef:
        key: opencloud-secrets
        property: idm-admin-password
    - secretKey: idm_idm_password
      remoteRef:
        key: opencloud-secrets
        property: idm-idm-password
    - secretKey: idm_reva_password
      remoteRef:
        key: opencloud-secrets
        property: idm-reva-password
    - secretKey: idm_idp_password
      remoteRef:
        key: opencloud-secrets
        property: idm-idp-password
    # Shared between the OpenCloud proxy (X-Calshare-Secret header, see proxy-routes.yaml)
    # and the calshare sidecar (radicale.yaml), not a user password.
    - secretKey: calshare_proxy_secret
      remoteRef:
        key: opencloud-secrets
        property: calshare-proxy-secret
