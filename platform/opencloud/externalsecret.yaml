# Every random value `opencloud init` would generate, made stable and shared: same values
# on every replica, kept across restarts. Vault path secret/opencloud-secrets, with the
# keys this deployment needs:
#
#   vault kv put secret/opencloud-secrets \
#     admin-password="$(openssl rand -hex 32)" \
#     calshare-proxy-secret="$(openssl rand -hex 32)" \
#     jwt-secret="$(openssl rand -hex 32)" \
#     machine-auth-api-key="$(openssl rand -hex 32)" \
#     transfer-secret="$(openssl rand -hex 32)" \
#     url-signing-secret="$(openssl rand -hex 32)" \
#     system-user-api-key="$(openssl rand -hex 32)" \
#     service-account-secret="$(openssl rand -hex 32)" \
#     idm-admin-password="$(openssl rand -hex 32)" \
#     idm-idm-password="$(openssl rand -hex 32)" \
#     idm-reva-password="$(openssl rand -hex 32)" \
#     idm-idp-password="$(openssl rand -hex 32)" \
#     wopi-secret="$(openssl rand -hex 32)"
#
# (`vault kv put` replaces the whole secret: list every key, otherwise the ones left out
# are deleted. `vault kv patch` only adds/updates.)
#
# admin-password is the local OpenCloud admin, not used at login (Keycloak): it must be
# in the path, but any value is fine. The idm-*-password are hashed into the IDM database
# on its first start only; changing them afterwards has no effect. system-user-id /
# admin-user-id are not secrets and are hardcoded in opencloud-config.yaml.
#
# Vault policy opencloud-policy must allow reading the data AND the metadata path
# (the metadata path is where the property names live):
#
#   path "secret/data/opencloud-secrets" { capabilities = ["read"] }
#   path "secret/metadata/opencloud-secrets" { capabilities = ["read"] }
#
# The policy is set up by hand in Vault (ADR 0004), not by GitOps; `vault policy write
# opencloud-policy -` from the admin token, or the "Edit" of the policy in the UI.
#
# Reads go through the shared ClusterSecretStore vault-backend: ESO logs in to Vault with
# the Kubernetes identity of its own ServiceAccount (external-secrets/external-secrets,
# Vault role "external-secrets"). The vault-auth SA of this namespace (rbac.yaml) is what
# the ClusterSecretStore binds to on the Kubernetes side, not a Vault role here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencloud-secrets
  namespace: opencloud
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: opencloud-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        JWT_SECRET: "{{ .jwt_secret }}"
        MACHINE_AUTH_API_KEY: "{{ .machine_auth_api_key }}"
        TRANSFER_SECRET: "{{ .transfer_secret }}"
        URL_SIGNING_SECRET: "{{ .url_signing_secret }}"
        SYSTEM_USER_API_KEY: "{{ .system_user_api_key }}"
        SERVICE_ACCOUNT_SECRET: "{{ .service_account_secret }}"
        IDM_ADMIN_PASSWORD: "{{ .idm_admin_password }}"
        IDM_IDM_PASSWORD: "{{ .idm_idm_password }}"
        IDM_REVA_PASSWORD: "{{ .idm_reva_password }}"
        IDM_IDP_PASSWORD: "{{ .idm_idp_password }}"
        CALSHARE_PROXY_SECRET: "{{ .calshare_proxy_secret }}"
        WOPI_SECRET: "{{ .wopi_secret }}"
  data:
    - secretKey: jwt_secret
      remoteRef:
        key: opencloud-secrets
        property: jwt-secret
    - secretKey: machine_auth_api_key
      remoteRef:
        key: opencloud-secrets
        property: machine-auth-api-key
    - secretKey: transfer_secret
      remoteRef:
        key: opencloud-secrets
        property: transfer-secret
    - secretKey: url_signing_secret
      remoteRef:
        key: opencloud-secrets
        property: url-signing-secret
    - secretKey: system_user_api_key
      remoteRef:
        key: opencloud-secrets
        property: system-user-api-key
    - secretKey: service_account_secret
      remoteRef:
        key: opencloud-secrets
        property: service-account-secret
    - secretKey: idm_admin_password
      remoteRef:
        key: opencloud-secrets
        property: idm-admin-password
    - secretKey: idm_idm_password
      remoteRef:
        key: opencloud-secrets
        property: idm-idm-password
    - secretKey: idm_reva_password
      remoteRef:
        key: opencloud-secrets
        property: idm-reva-password
    - secretKey: idm_idp_password
      remoteRef:
        key: opencloud-secrets
        property: idm-idp-password
    # Shared between the OpenCloud proxy (X-Calshare-Secret header, see proxy-routes.yaml)
    # and the calshare sidecar (radicale.yaml), not a user password.
    - secretKey: calshare_proxy_secret
      remoteRef:
        key: opencloud-secrets
        property: calshare-proxy-secret
    # collaboration (WOPI) needs a secret even when no office app is configured
    - secretKey: wopi_secret
      remoteRef:
        key: opencloud-secrets
        property: wopi-secret
