# converted to a Route automatically (openshift.io/ingress-to-route), which also
# syncs the cert-manager-issued secret into the Route's TLS fields
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden
  namespace: vaultwarden
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: openshift-default
  rules:
    - host: pass.tomlab.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                port:
                  number: 80
  tls:
    - hosts:
        - pass.tomlab.fr
      secretName: vaultwarden-tls-cert
